server:
  port: 8083

logging:
  structured:
    format:
      console: logstash

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification}
    username: ${DB_USER:notification_service}
    password: ${DB_PASSWORD}
    hikari:
      # Every delivery attempt during a DB outage borrows a connection first. Hikari's 30s
      # default would make each attempt hang for 30s before the error handler even sees it;
      # 2s keeps the retry cadence set by notification.retry, not by the pool.
      connection-timeout: 2000
      data-source-properties:
        # pgjdbc's default socketTimeout is 0 (wait forever): a statement in flight when the
        # DB stops answering (e.g. `docker pause`) would block the consumer thread for good
        # instead of failing into the retry path. Seconds, not millis.
        socketTimeout: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      observation-enabled: true
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Deserialization runs inside poll(), before any listener or error handler. A bare
      # JsonDeserializer that throws there would make the same record fail on every poll,
      # forever (the classic poison pill). ErrorHandlingDeserializer catches the failure and
      # hands the listener container a DeserializationException instead, which the error
      # handler dead-letters -- see KafkaErrorHandlingConfig.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # Transfer publishes plain JSON strings with no __TypeId__ header, so the target type
        # is fixed here rather than read from the record.
        spring.json.value.default.type: com.showcase.notification.event.TransferEvent
        spring.json.use.type.headers: false

info:
  commit: ${GIT_SHA:unknown}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      "service.version": "@project.version@"
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

notification:
  topics:
    completed: transfer.completed
    failed: transfer.failed
  # Backoff between delivery attempts of a record that failed with a transient (DB) error.
  # There is deliberately no attempt limit -- see KafkaErrorHandlingConfig. max-interval must
  # stay well under the consumer's max.poll.interval.ms (5 min default): the consumer thread
  # waits out each backoff before polling again.
  retry:
    initial-interval: 1s
    multiplier: 2.0
    max-interval: 30s
