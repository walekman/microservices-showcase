<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank UI</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/theme.js"></script>
</head>
<body>
    <div id="loading"><div class="spinner" aria-hidden="true"></div><span id="loading-text">Loading your account…</span></div>
    <div id="app" hidden>
        <header>
            <div class="header-inner">
                <div class="brand"><span class="brand-mark" aria-hidden="true">B</span>Bank UI</div>
                <span id="header-user" class="header-user"></span>
                <button id="theme-button" type="button" class="btn-ghost">◐ Auto</button>
                <button id="logout-button" type="button" class="btn-ghost">Log out</button>
            </div>
        </header>
        <main id="main-content"></main>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
