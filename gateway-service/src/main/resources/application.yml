server:
  port: 8080

spring:
  application:
    name: gateway-service
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

account-service:
  base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}

transfer-service:
  base-url: ${TRANSFER_SERVICE_URL:http://localhost:8082}
