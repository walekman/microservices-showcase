server:
  port: 8082

spring:
  application:
    name: transfer-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transfer}
    username: ${DB_USER:transfer_service}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

account-service:
  base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  connect-timeout: 2s
  read-timeout: 5s

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        # Scaled by retry.instances.accountService's max-attempts (3): @Retry is the outer
        # decorator, so each retried call is recorded as up to 3 separate circuit-breaker
        # calls, not one. Unscaled (window 10 / minimum 5), a full Account Service outage
        # tripped the circuit after just ~2 failed logical calls (2 * 3 = 6 >= 5) -- observed
        # live during Phase 3's own verification. These numbers restore the original design
        # intent -- 5 failed logical calls out of a window of 10 -- once the x3 retry
        # multiplier is accounted for: 15 physical calls (5 * 3) out of a window of 30 (10 * 3).
        sliding-window-size: 30
        minimum-number-of-calls: 15
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.showcase.transfer.client.AccountServiceUnavailableException
        ignore-exceptions:
          - com.showcase.transfer.client.AccountRejectedException
  retry:
    instances:
      accountService:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.showcase.transfer.client.AccountServiceUnavailableException
        ignore-exceptions:
          - com.showcase.transfer.client.AccountRejectedException

transfer:
  compensation:
    sweep-interval: 15s
    pending-stale-after: 120s
