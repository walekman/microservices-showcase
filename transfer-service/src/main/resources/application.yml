server:
  port: 8082

spring:
  application:
    name: transfer-service
  threads:
    virtual:
      enabled: true
  # OutboxPublisher and CompensationScheduler's two sweeps are all SchedulingConfigurer
  # tasks, and Spring Boot defaults task scheduling to a single-thread pool when nothing
  # sets this -- meaning all three tasks serialize on one thread ("scheduling-1"). One
  # thread per scheduled task (publishPending, drainCompensationRequired,
  # sweepStalePending) so a slow/blocked tick on one cannot starve the others -- found live
  # during Phase 4's final review, see docs/roadmap.md.
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transfer}
    username: ${DB_USER:transfer_service}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        # KafkaProducer.send() blocks the CALLING thread synchronously (inside its
        # metadata-wait), before it even returns a Future to call .get() on, for up to
        # max.block.ms when the broker is unreachable -- the kafka-clients default is 60s.
        # OutboxPublisherProperties.publishTimeout only bounds the .get() call on the
        # Future send() eventually returns; it does nothing about this earlier blocking
        # wait. Bounding max.block.ms here makes a down broker fail fast instead of
        # occupying a scheduling thread for up to 500 rows * 60s per poll tick. See
        # OutboxPublisher's own comments for how a broker-unreachable failure is then
        # distinguished from a row-specific one.
        max.block.ms: 5000
        # request.timeout.ms must be lowered too: KafkaProducer validates
        # delivery.timeout.ms >= linger.ms + request.timeout.ms at construction time and
        # THROWS (fails the producer bean's own creation, not just one send) if that doesn't
        # hold -- found live verifying this fix, since the kafka-clients default for
        # request.timeout.ms is 30000ms, comfortably larger than a delivery.timeout.ms of
        # 10000ms on its own. 5000ms here (linger.ms defaults to 0) keeps 10000 >= 0 + 5000
        # valid with room to spare.
        request.timeout.ms: 5000
        # Bounds how long an already-sent-but-unacked record can sit in-flight before the
        # Future returned by send() completes exceptionally -- the other half of "a broker
        # outage fails fast" alongside max.block.ms above.
        delivery.timeout.ms: 10000
  security:
    oauth2:
      client:
        registration:
          # transfer-service's own machine identity -- used only when AuthorizationPropagatingInterceptor
          # finds no inbound user token to relay (CompensationScheduler's background sweep).
          transfer-service:
            client-id: transfer-service
            client-secret: ${TRANSFER_SERVICE_CLIENT_SECRET:transfer-service-secret}
            authorization-grant-type: client_credentials
        provider:
          transfer-service:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/showcase/protocol/openid-connect/token}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

account-service:
  base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  connect-timeout: 2s
  read-timeout: 5s

fraud-service:
  base-url: ${FRAUD_SERVICE_URL:http://localhost:8084}
  connect-timeout: 2s
  read-timeout: 5s

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/showcase}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/showcase/protocol/openid-connect/certs}

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        # Scaled by retry.instances.accountService's max-attempts (3): @Retry is the outer
        # decorator, so each retried call is recorded as up to 3 separate circuit-breaker
        # calls, not one. Unscaled (window 10 / minimum 5), a full Account Service outage
        # tripped the circuit after just ~2 failed logical calls (2 * 3 = 6 >= 5) -- observed
        # live during Phase 3's own verification. These numbers restore the original design
        # intent -- 5 failed logical calls out of a window of 10 -- once the x3 retry
        # multiplier is accounted for: 15 physical calls (5 * 3) out of a window of 30 (10 * 3).
        sliding-window-size: 30
        minimum-number-of-calls: 15
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.showcase.transfer.client.AccountServiceUnavailableException
        ignore-exceptions:
          - com.showcase.transfer.client.AccountRejectedException
      fraudService:
        # Same tuning as accountService (see that instance's comment for the x3 retry-attempts
        # multiplier reasoning) -- reused rather than re-derived, since the shape is identical.
        sliding-window-size: 30
        minimum-number-of-calls: 15
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.showcase.transfer.client.FraudServiceUnavailableException
        ignore-exceptions:
          - com.showcase.transfer.client.FraudRejectedException
  retry:
    instances:
      accountService:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.showcase.transfer.client.AccountServiceUnavailableException
        ignore-exceptions:
          - com.showcase.transfer.client.AccountRejectedException
      fraudService:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.showcase.transfer.client.FraudServiceUnavailableException
        ignore-exceptions:
          - com.showcase.transfer.client.FraudRejectedException

transfer:
  compensation:
    sweep-interval: 15s
    pending-stale-after: 120s
    sweep-batch-size: 500
  outbox:
    poll-interval: 5s
    batch-size: 500
    publish-timeout: 5s
    topics:
      completed: transfer.completed
      failed: transfer.failed
