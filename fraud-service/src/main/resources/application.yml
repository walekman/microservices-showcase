server:
  port: 8084

logging:
  structured:
    format:
      console: logstash

spring:
  application:
    name: fraud-service
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/showcase}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/showcase/protocol/openid-connect/certs}

fraud:
  blocklist:
    # Comma-separated account ids, e.g. "11111111-1111-1111-1111-111111111111,22222222-...".
    # Boot's relaxed binding converts a single comma-delimited env var into this List<UUID>.
    account-ids: ${FRAUD_BLOCKLIST_ACCOUNT_IDS:}
