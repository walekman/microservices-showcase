apiVersion: 1

# Tempo got a fixed uid in Phase 13. A Grafana container from before that still holds Tempo under
# a generated uid, and provisioning can't change a data source's uid: Grafana fails to start
# ("data source not found"). Deleting it first lets it be recreated with the new uid on every start.
deleteDatasources:
  - name: Tempo
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  # `$${...}` is a literal `${...}`: Grafana expands environment variables in provisioning files,
  # and would otherwise replace the template variables below with empty strings.
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # "Logs for this span": every service's lines for the whole trace, not just this span.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        customQuery: true
        query: '{service=~".+"} | json | traceId="$${__trace.traceId}"'
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: traceId
          matcherType: regex
          matcherRegex: '"traceId":"(\w+)"'
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View trace
