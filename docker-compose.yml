services:
  postgres:
    image: postgres:16-alpine
    container_name: showcase-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD}
      TRANSFER_DB_PASSWORD: ${TRANSFER_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: showcase-account-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: account
      DB_USER: account_service
      DB_PASSWORD: ${ACCOUNT_DB_PASSWORD}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/showcase/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/showcase
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  transfer-service:
    build:
      context: .
      dockerfile: transfer-service/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: showcase-transfer-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: transfer
      DB_USER: transfer_service
      DB_PASSWORD: ${TRANSFER_DB_PASSWORD}
      ACCOUNT_SERVICE_URL: http://account-service:8081
      FRAUD_SERVICE_URL: http://fraud-service:8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/showcase/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/showcase
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/showcase/protocol/openid-connect/token
      TRANSFER_SERVICE_CLIENT_SECRET: ${TRANSFER_SERVICE_CLIENT_SECRET:-transfer-service-secret}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_healthy
      fraud-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  kafka:
    image: apache/kafka:3.8.0
    container_name: showcase-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: showcase-notification-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: notification
      DB_USER: notification_service
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  fraud-service:
    build:
      context: .
      dockerfile: fraud-service/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: showcase-fraud-service
    environment:
      FRAUD_BLOCKLIST_ACCOUNT_IDS: ${FRAUD_BLOCKLIST_ACCOUNT_IDS:-}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/showcase/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/showcase
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8084:8084"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: showcase-redis
    # A cache, not a store: no RDB snapshots, no AOF. Losing it only costs provider calls.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  fx-service:
    build:
      context: .
      dockerfile: fx-service/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: showcase-fx-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FX_PROVIDER_URL: ${FX_PROVIDER_URL:-https://api.frankfurter.dev/v1}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/showcase/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/showcase
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8085:8085"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: showcase-gateway-service
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8081
      TRANSFER_SERVICE_URL: http://transfer-service:8082
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/showcase/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/showcase
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8080:8080"
    depends_on:
      account-service:
        condition: service_healthy
      transfer-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  web-ui:
    image: nginx:alpine
    container_name: showcase-web-ui
    volumes:
      - ./web-ui:/usr/share/nginx/html:ro
    ports:
      - "8090:80"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: showcase-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      # Keycloak 26 defaults to "hostname v2": a single URL, not the v1
      # hostname/hostname-port/hostname-strict-https trio (verified live -- the v1 options
      # produced a "still in use" deprecation warning on startup even though they worked).
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak/showcase-realm.json:/opt/keycloak/data/import/showcase-realm.json:ro
      - ./docker/keycloak/themes/bank-ui:/opt/keycloak/themes/bank-ui:ro
    healthcheck:
      # Verified live: this image (quay.io/keycloak/keycloak, UBI9-based) has no curl or wget,
      # only bash -- a bash /dev/tcp check is the standard workaround. Keycloak doesn't open
      # its HTTP port until realm import has already finished, so "the port is open" is a
      # reliable enough proxy for "the realm import finished", not just "the process is up".
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  tempo:
    image: grafana/tempo:latest
    container_name: showcase-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: showcase-otel-collector
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:latest
    container_name: showcase-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  grafana:
    image: grafana/grafana:latest
    container_name: showcase-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards-data:ro
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
